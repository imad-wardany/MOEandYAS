<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mohammad & Yasmine - Reception</title>

  <!-- Prevent Stale Cache on iOS Bookmarks & Android Shortcuts -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- PWA & Mobile Viewport Safeguards -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; }

    /* Offline / Online Status Banner */
    .connection-banner {
      background-color: var(--danger);
      color: white;
      text-align: center;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .connection-banner.online {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .connection-banner.offline {
      background-color: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      border: 1px solid var(--danger);
      display: block;
    }

    header { text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Stats Bar */
    .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 8px 4px; border-radius: 8px; text-align: center;
    }
    .stat-card .num { font-size: 1.1rem; font-weight: bold; color: #ffffff; }
    .stat-card .label { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }

    /* Progress Bar */
    .progress-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 8px 12px; margin-bottom: 12px;
    }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px; }
    .progress-track { width: 100%; height: 8px; background-color: var(--bg-color); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.3s ease; }

    /* Controls */
    .controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      width: 100%; padding: 12px; background-color: #172554;
      border: 2px solid #38bdf8; border-radius: 8px; color: #ffffff;
      font-size: 1rem; outline: none;
    }
    input[type="text"]::placeholder { color: #93c5fd; }

    .action-buttons { display: flex; gap: 6px; width: 100%; }
    .btn {
      flex: 1; background-color: var(--primary); color: white; border: none;
      padding: 8px 4px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .btn-secondary { background-color: #334155; color: var(--text-main); }
    .btn-filter { background-color: #334155; color: var(--text-muted); border: 1px solid var(--border-color); }
    .btn-filter.active { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border-color: var(--warning); }

    /* Tables & Guest Cards */
    .tables-list { display: flex; flex-direction: column; gap: 10px; }
    .table-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .table-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; cursor: pointer; background-color: var(--card-bg);
    }
    .table-badge { background: #312e81; color: #a5b4fc; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; }
    .guest-list { display: none; flex-direction: column; gap: 6px; padding: 10px; border-top: 1px dashed var(--border-color); }
    .table-card.expanded .guest-list { display: flex; }

    .guest-item { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); padding: 8px 10px; border-radius: 6px; gap: 8px; }
    .guest-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .guest-name { font-size: 0.9rem; font-weight: 500; }
    
    /* Stepper Counter Controls (- nb +) */
    .counter-control {
      display: inline-flex;
      align-items: center;
      background-color: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      overflow: hidden;
      user-select: none;
    }
    .counter-btn {
      background: transparent;
      color: #38bdf8;
      border: none;
      padding: 3px 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .counter-btn:disabled {
      color: #64748b;
      cursor: not-allowed;
    }
    .counter-btn:active:not(:disabled) {
      background-color: rgba(56, 189, 248, 0.2);
    }
    .counter-value {
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 0 4px;
      min-width: 20px;
      text-align: center;
    }

    .check-btn {
      background-color: #334155; color: var(--text-muted); border: none;
      padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .check-btn.seated { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }

    footer { text-align: center; margin-top: 24px; padding: 12px 0; color: var(--text-muted); font-size: 0.75rem; direction: ltr; }
  </style>
</head>
<body>
  <div class="container">
    <div id="connectionStatus" class="connection-banner">▲ انقطع الاتصال - بدنا نرووووووق</div>

    <header>
      <h1>Mohammad & Yasmine</h1>
    </header>

    <div class="stats-bar">
      <div class="stat-card"><div class="num" id="totalGuests">0</div><div class="label">المدعوون</div></div>
      <div class="stat-card"><div class="num" id="seatedGuests" style="color: var(--success);">0</div><div class="label">الحاضرون</div></div>
      <div class="stat-card"><div class="num" id="seatedVisitors" style="color: #38bdf8;">0</div><div class="label">الأشخاص</div></div>
      <div class="stat-card"><div class="num" id="totalTables">0</div><div class="label">الطاولات</div></div>
    </div>

    <div class="progress-card">
      <div class="progress-header">
        <span>نسبة الحضور</span>
        <span id="progressRatio">0 / 0 (0%)</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressBarFill"></div></div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="ابحث باسم الضيف أو رقم الطاولة..." oninput="renderApp()">
      <div class="action-buttons">
        <button class="btn btn-secondary" id="toggleAllBtn" onclick="toggleAllTables()">توسيع الكل</button>
        <button class="btn btn-filter" id="filterAbsentBtn" onclick="toggleAbsentFilter()">الغائبين فقط</button>
        <button class="btn btn-filter" id="filterIncompleteBtn" onclick="toggleIncompleteFilter()">غير مكتملة</button>
      </div>
    </div>

    <div class="tables-list" id="tablesList">
      <div style="text-align:center; padding:20px; color:var(--text-muted);">جاري الاتصال بقاعدة البيانات...</div>
    </div>

    <footer>Copyright © Imad Al Wardany +96179104792</footer>
  </div>

  <!-- Force Removal of Stale Service Worker Caches for Bookmarks -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let r of registrations) r.unregister();
      });
    }
  </script>

  <!-- Firebase RTDB Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeq1zeX7vLCHV2TjkMVannE6mOG09cESo",
      authDomain: "wedding-moeandyas.firebaseapp.com",
      databaseURL: "https://wedding-moeandyas-default-rtdb.firebaseio.com",
      projectId: "wedding-moeandyas",
      storageBucket: "wedding-moeandyas.firebasestorage.app",
      messagingSenderId: "871063287288",
      appId: "1:871063287288:web:475beddf326a96ad80120d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const guestsRef = ref(db, 'guests');

    let currentGuests = {};
    let expandedTables = new Set();
    let allExpandedState = false;
    let showOnlyAbsent = false;
    let showOnlyIncomplete = false;

    // Monitor Network Connection State
    const connectedRef = ref(db, ".info/connected");
    const statusBanner = document.getElementById("connectionStatus");

    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        statusBanner.className = "connection-banner online";
        statusBanner.textContent = "● متصل - اهلا وسهلا بضيوفنا";
        setTimeout(() => { statusBanner.style.display = "none"; }, 2500);
      } else {
        statusBanner.className = "connection-banner offline";
        statusBanner.textContent = "▲ انقطع الاتصال - بدنا نروووووق";
        statusBanner.style.display = "block";
      }
    });

    // Real-time synchronization stream
    onValue(guestsRef, (snapshot) => {
      currentGuests = snapshot.val() || {};
      renderApp();
    });

    // Offline-Resilient & Anti-Crash Toggle
    window.toggleSeated = (id, btnElement) => {
      if (btnElement) btnElement.disabled = true;
      
      const currentStatus = currentGuests[id]?.seated || false;
      const nextStatus = !currentStatus;

      // Optimistic Local Update
      if (currentGuests[id]) currentGuests[id].seated = nextStatus;
      renderApp();

      // Non-blocking Firebase write
      update(ref(db, `guests/${id}`), { seated: nextStatus })
        .catch(err => console.error("Write queued locally:", err))
        .finally(() => { if (btnElement) btnElement.disabled = false; });
    };

    // Incremental Stepper Update (+ / -)
    window.changeVisitorCount = (id, delta) => {
      const current = Number(currentGuests[id]?.visitors) || 1;
      const nextCount = Math.max(1, current + delta); // Prevents going below 1
      if (nextCount === current) return;

      // Optimistic Local Update
      if (currentGuests[id]) currentGuests[id].visitors = nextCount;
      renderApp();

      // Non-blocking Firebase write
      update(ref(db, `guests/${id}`), { visitors: nextCount })
        .catch(err => console.error("Visitor count queued locally:", err));
    };

    window.toggleTable = (tableNum) => {
      if (expandedTables.has(tableNum)) expandedTables.delete(tableNum);
      else expandedTables.add(tableNum);
      renderApp();
    };

    window.toggleAllTables = () => {
      const allTables = [...new Set(Object.values(currentGuests).map(g => g.table))];
      if (allExpandedState) {
        expandedTables.clear();
        allExpandedState = false;
      } else {
        allTables.forEach(t => expandedTables.add(t));
        allExpandedState = true;
      }
      renderApp();
    };

    window.toggleAbsentFilter = () => { showOnlyAbsent = !showOnlyAbsent; renderApp(); };
    window.toggleIncompleteFilter = () => { showOnlyIncomplete = !showOnlyIncomplete; renderApp(); };

    window.renderApp = () => {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const listContainer = document.getElementById('tablesList');
      const guestArray = Object.keys(currentGuests).map(id => ({
        id,
        ...currentGuests[id],
        visitors: Number(currentGuests[id].visitors) || 1
      }));

      const totalGuestsCount = guestArray.length;
      const seatedGuestsCount = guestArray.filter(g => g.seated).length;
      const seatedVisitorsCount = guestArray.filter(g => g.seated).reduce((acc, g) => acc + g.visitors, 0);
      const progressPercent = totalGuestsCount > 0 ? Math.round((seatedGuestsCount / totalGuestsCount) * 100) : 0;

      document.getElementById('totalGuests').textContent = totalGuestsCount;
      document.getElementById('seatedGuests').textContent = seatedGuestsCount;
      document.getElementById('seatedVisitors').textContent = seatedVisitorsCount;
      
      const uniqueTables = [...new Set(guestArray.map(g => g.table))];
      document.getElementById('totalTables').textContent = uniqueTables.length;

      document.getElementById('progressRatio').textContent = `${seatedGuestsCount} من ${totalGuestsCount} (${progressPercent}%)`;
      document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

      document.getElementById('toggleAllBtn').textContent = allExpandedState ? 'طي الكل' : 'توسيع الكل';

      const absentBtn = document.getElementById('filterAbsentBtn');
      absentBtn.classList.toggle('active', showOnlyAbsent);
      absentBtn.textContent = showOnlyAbsent ? '✕ الغائبين' : 'الغائبين فقط';

      const incompleteBtn = document.getElementById('filterIncompleteBtn');
      incompleteBtn.classList.toggle('active', showOnlyIncomplete);
      incompleteBtn.textContent = showOnlyIncomplete ? '✕ غير مكتملة' : 'غير مكتملة';

      const grouped = {};
      guestArray.forEach(g => {
        const matchSearch = g.name.toLowerCase().includes(query) || String(g.table).toLowerCase().includes(query);
        const matchAbsent = !showOnlyAbsent || !g.seated;

        if (matchSearch && matchAbsent) {
          if (!grouped[g.table]) grouped[g.table] = [];
          grouped[g.table].push(g);
        }
      });

      let sortedTables = Object.keys(grouped).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      if (showOnlyIncomplete) {
        sortedTables = sortedTables.filter(tableNum => {
          const tableGuests = guestArray.filter(g => g.table === tableNum);
          return tableGuests.some(g => !g.seated);
        });
      }

      if (sortedTables.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد نتائج مطابقة</div>`;
        return;
      }

      const isSearching = query.length > 0;

      listContainer.innerHTML = sortedTables.map(tableNum => {
        const isExpanded = isSearching || expandedTables.has(tableNum);
        const tableGuests = guestArray.filter(g => g.table === tableNum);
        const totalVisitors = tableGuests.reduce((acc, g) => acc + g.visitors, 0);
        const seatedVisitors = tableGuests.filter(g => g.seated).reduce((acc, g) => acc + g.visitors, 0);

        return `
          <div class="table-card ${isExpanded ? 'expanded' : ''}">
            <div class="table-header" onclick="toggleTable('${tableNum}')">
              <span class="table-badge">طاولة رقم ${tableNum}</span>
              <div>
                <span style="font-size:0.85rem; color:#38bdf8; font-weight:bold; margin-left:6px;">
                  (${seatedVisitors}/${totalVisitors})
                </span>
                <span style="font-size:0.75rem; color:var(--text-muted);">▼</span>
              </div>
            </div>
            <div class="guest-list">
              ${grouped[tableNum].map(g => `
                <div class="guest-item">
                  <div class="guest-info">
                    <span class="guest-name">${g.name}</span>
                    <div class="counter-control" onclick="event.stopPropagation()">
                      <button class="counter-btn" onclick="changeVisitorCount('${g.id}', -1)" ${g.visitors <= 1 ? 'disabled' : ''}>-</button>
                      <span class="counter-value">${g.visitors}</span>
                      <button class="counter-btn" onclick="changeVisitorCount('${g.id}', 1)">+</button>
                    </div>
                  </div>
                  <button class="check-btn ${g.seated ? 'seated' : ''}" onclick="event.stopPropagation(); toggleSeated('${g.id}', this)">
                    ${g.seated ? '✓ تم الجلوس' : 'تأكيد الوصول'}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    };
  </script>
</body>
</html>
