<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohammad & Yasmine</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-bar { display: flex; gap: 10px; margin-bottom: 16px; }
    .stat-card {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 12px; border-radius: 10px; text-align: center;
    }
    .stat-card .num { font-size: 1.4rem; font-weight: bold; color: #ffffff; }
    .stat-card .label { font-size: 0.8rem; color: var(--text-muted); }

    /* Attendance Progress Bar */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .progress-header span:first-child { font-weight: 600; color: var(--text-main); }
    .progress-track {
      width: 100%;
      height: 10px;
      background-color: var(--bg-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 6px;
      transition: width 0.4s ease-in-out;
    }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; }
    
    input[type="text"] {
      width: 100%; padding: 12px 14px; background-color: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
      font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn {
      background-color: var(--primary); color: white; border: none;
      padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .btn-secondary { background-color: #334155; color: var(--text-main); }

    .tables-list { display: flex; flex-direction: column; gap: 14px; }
    .table-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
    
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      cursor: pointer;
      user-select: none;
      background-color: var(--card-bg);
      transition: background-color 0.2s;
    }
    .table-header:hover { background-color: rgba(255, 255, 255, 0.03); }
    .table-badge { background: #312e81; color: #a5b4fc; padding: 4px 12px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; }

    .table-header-info { display: flex; align-items: center; gap: 12px; }
    .chevron-icon {
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    .table-card.expanded .chevron-icon { transform: rotate(180deg); }

    .guest-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px 16px 16px;
      border-top: 1px dashed var(--border-color);
      margin-top: 4px;
      padding-top: 12px;
    }
    .table-card.expanded .guest-list { display: flex; }

    .guest-item { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); padding: 10px 14px; border-radius: 8px; }
    .guest-name { font-size: 1.05rem; font-weight: 500; }

    .check-btn {
      background-color: #334155; color: var(--text-muted); border: none;
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    }
    .check-btn.seated {
      background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: var(--card-bg); width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Mohammad & Yasmine</h1>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="num" id="totalGuests">0</div>
        <div class="label">إجمالي الضيوف</div>
      </div>
      <div class="stat-card">
        <div class="num" id="seatedGuests" style="color: var(--success);">0</div>
        <div class="label">الحاضرون</div>
      </div>
      <div class="stat-card">
        <div class="num" id="totalTables">0</div>
        <div class="label">عدد الطاولات</div>
      </div>
    </div>

    <!-- Attendance Progress Bar -->
    <div class="progress-card">
      <div class="progress-header">
        <span>الحاضرون من إجمالي الضيوف</span>
        <span id="progressRatio">0 / 0 (0%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBarFill"></div>
      </div>
    </div>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث باسم الضيف أو رقم الطاولة..." oninput="renderApp()">
      </div>
      <button class="btn btn-secondary" id="toggleAllBtn" onclick="toggleAllTables()">توسيع الكل</button>
      <button class="btn" onclick="openModal()">+ إضافة ضيف</button>
    </div>

    <div class="tables-list" id="tablesList">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">جاري تحميل البيانات المباشرة...</div>
    </div>
  </div>

  <!-- Modal for Adding Guest -->
  <div class="modal-overlay" id="guestModal">
    <div class="modal">
      <h2 style="margin-bottom: 15px;">إضافة ضيف جديد</h2>
      <form onsubmit="addGuest(event)">
        <div style="margin-bottom: 12px;">
          <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:4px;">اسم الضيف</label>
          <input type="text" id="newGuestName" required placeholder="أدخل اسم الضيف الكامل">
        </div>
        <div style="margin-bottom: 20px;">
          <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:4px;">رقم الطاولة</label>
          <input type="text" id="newTableNumber" required placeholder="مثال: 1">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeq1zeX7vLCHV2TjkMVannE6mOG09cESo",
      authDomain: "wedding-moeandyas.firebaseapp.com",
      databaseURL: "https://wedding-moeandyas-default-rtdb.firebaseio.com",
      projectId: "wedding-moeandyas",
      storageBucket: "wedding-moeandyas.firebasestorage.app",
      messagingSenderId: "871063287288",
      appId: "1:871063287288:web:475beddf326a96ad80120d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const guestsRef = ref(db, 'guests');

    let currentGuests = {};
    let expandedTables = new Set();
    let allExpandedState = false;

    onValue(guestsRef, (snapshot) => {
      const data = snapshot.val();
      currentGuests = data || {};
      renderApp();
    });

    window.toggleSeated = (id) => {
      const guestRef = ref(db, `guests/${id}`);
      update(guestRef, { seated: !currentGuests[id].seated });
    };

    window.addGuest = (e) => {
      e.preventDefault();
      const name = document.getElementById('newGuestName').value.trim();
      const table = document.getElementById('newTableNumber').value.trim();
      if (!name || !table) return;

      push(guestsRef, { name, table, seated: false });
      document.getElementById('newGuestName').value = '';
      document.getElementById('newTableNumber').value = '';
      closeModal();
    };

    window.toggleTable = (tableNum) => {
      if (expandedTables.has(tableNum)) {
        expandedTables.delete(tableNum);
      } else {
        expandedTables.add(tableNum);
      }
      renderApp();
    };

    window.toggleAllTables = () => {
      const guestArray = Object.keys(currentGuests).map(id => ({ id, ...currentGuests[id] }));
      const uniqueTables = [...new Set(guestArray.map(g => g.table))];

      if (allExpandedState) {
        expandedTables.clear();
        allExpandedState = false;
      } else {
        uniqueTables.forEach(t => expandedTables.add(t));
        allExpandedState = true;
      }
      renderApp();
    };

    window.renderApp = () => {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const listContainer = document.getElementById('tablesList');
      const guestArray = Object.keys(currentGuests).map(id => ({ id, ...currentGuests[id] }));

      const totalCount = guestArray.length;
      const seatedCount = guestArray.filter(g => g.seated).length;
      const progressPercent = totalCount > 0 ? Math.round((seatedCount / totalCount) * 100) : 0;

      document.getElementById('totalGuests').textContent = totalCount;
      document.getElementById('seatedGuests').textContent = seatedCount;
      
      const uniqueTables = [...new Set(guestArray.map(g => g.table))];
      document.getElementById('totalTables').textContent = uniqueTables.length;

      document.getElementById('progressRatio').textContent = `${seatedCount} من ${totalCount} (${progressPercent}%)`;
      document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

      // Update Expand/Collapse All Button Text
      const toggleBtn = document.getElementById('toggleAllBtn');
      if (toggleBtn) {
        toggleBtn.textContent = allExpandedState ? 'طي الكل' : 'توسيع الكل';
      }

      const grouped = {};
      guestArray.forEach(g => {
        const matchSearch = g.name.toLowerCase().includes(query) || g.table.toLowerCase().includes(query);
        if (matchSearch) {
          if (!grouped[g.table]) grouped[g.table] = [];
          grouped[g.table].push(g);
        }
      });

      // Automatically expand tables when typing in the search box
      const isSearching = query.length > 0;

      const sortedTables = Object.keys(grouped).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

      if (sortedTables.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد نتائج مطابقة</div>`;
        return;
      }

      listContainer.innerHTML = sortedTables.map(tableNum => {
        const isExpanded = isSearching || expandedTables.has(tableNum);
        const seatedInTable = grouped[tableNum].filter(g => g.seated).length;

        return `
          <div class="table-card ${isExpanded ? 'expanded' : ''}">
            <div class="table-header" onclick="toggleTable('${tableNum}')">
              <span class="table-badge">طاولة رقم ${tableNum}</span>
              <div class="table-header-info">
                <span style="font-size:0.85rem; color:var(--text-muted);">${seatedInTable}/${grouped[tableNum].length} ضيوف</span>
                <span class="chevron-icon">▼</span>
              </div>
            </div>
            <div class="guest-list">
              ${grouped[tableNum].map(g => `
                <div class="guest-item">
                  <span class="guest-name">${g.name}</span>
                  <button class="check-btn ${g.seated ? 'seated' : ''}" onclick="event.stopPropagation(); toggleSeated('${g.id}')">
                    ${g.seated ? '✓ تم الجلوس' : 'تأكيد الوصول'}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    };

    window.openModal = () => document.getElementById('guestModal').classList.add('active');
    window.closeModal = () => document.getElementById('guestModal').classList.remove('active');
  </script>
</body>
</html>
