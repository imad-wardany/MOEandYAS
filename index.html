<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohammad & Yasmine</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100vh - 32px); }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4 Statistics Cards Bar */
    .stats-bar { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      margin-bottom: 14px; 
    }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 8px 4px; border-radius: 8px; text-align: center;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .stat-card .num { font-size: 1.2rem; font-weight: bold; color: #ffffff; line-height: 1.2; }
    .stat-card .label { font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; }

    /* Attendance Progress Bar */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .progress-header span:first-child { font-weight: 600; color: var(--text-main); }
    .progress-track {
      width: 100%;
      height: 8px;
      background-color: var(--bg-color);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 6px;
      transition: width 0.4s ease-in-out;
    }

    /* Controls Layout */
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .search-box { width: 100%; }
    
    input[type="text"] {
      width: 100%; padding: 12px 14px; background-color: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
      font-size: 1rem; outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1; min-width: 140px; background-color: var(--primary); color: white; border: none;
      padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer;
      text-align: center;
    }
    .btn-secondary { background-color: #334155; color: var(--text-main); }
    .btn-filter { background-color: #334155; color: var(--text-muted); border: 1px solid var(--border-color); }
    .btn-filter.active { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border-color: rgba(245, 158, 11, 0.5); }

    .tables-list { display: flex; flex-direction: column; gap: 14px; flex-grow: 1; }
    .table-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
    
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
      background-color: var(--card-bg);
      transition: background-color 0.2s;
    }
    .table-header:hover { background-color: rgba(255, 255, 255, 0.03); }
    .table-badge { background: #312e81; color: #a5b4fc; padding: 4px 12px; border-radius: 20px; font-size: 1rem; font-weight: bold; }

    .table-header-info { display: flex; align-items: center; gap: 10px; }
    .chevron-icon {
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    .table-card.expanded .chevron-icon { transform: rotate(180deg); }

    .guest-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px 16px 16px;
      border-top: 1px dashed var(--border-color);
      margin-top: 4px;
      padding-top: 12px;
    }
    .table-card.expanded .guest-list { display: flex; }

    .guest-item { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); padding: 10px 14px; border-radius: 8px; }
    
    /* Guest Info & Visitors Dropdown */
    .guest-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .guest-name { font-size: 0.95rem; font-weight: 500; }
    
    .visitor-select {
      background-color: #334155;
      color: #38bdf8;
      border: 1px solid #475569;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }
    .visitor-select:focus { border-color: var(--primary); }

    .check-btn {
      background-color: #334155; color: var(--text-muted); border: none;
      padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
    }
    .check-btn.seated {
      background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* Footer Styles */
    footer {
      text-align: center;
      margin-top: 30px;
      padding: 16px 0;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.82rem;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Section -->
    <header>
      <h1>Mohammad & Yasmine</h1>
    </header>

    <!-- Top Statistics Summary -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="num" id="totalGuests">0</div>
        <div class="label">المدعوون</div>
      </div>
      <div class="stat-card">
        <div class="num" id="seatedGuests" style="color: var(--success);">0</div>
        <div class="label">الحاضرون</div>
      </div>
      <div class="stat-card">
        <div class="num" id="seatedVisitors" style="color: #38bdf8;">0</div>
        <div class="label">عدد الأشخاص</div>
      </div>
      <div class="stat-card">
        <div class="num" id="totalTables">0</div>
        <div class="label">عدد الطاولات</div>
      </div>
    </div>

    <!-- Attendance Progress Bar -->
    <div class="progress-card">
      <div class="progress-header">
        <span>الحاضرون من المدعوين</span>
        <span id="progressRatio">0 / 0 (0%)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- Search Box & Action Controls -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث باسم الضيف أو رقم الطاولة..." oninput="renderApp()">
      </div>
      <div class="action-buttons">
        <button class="btn btn-secondary" id="toggleAllBtn" onclick="toggleAllTables()">توسيع الكل</button>
        <button class="btn btn-filter" id="filterAbsentBtn" onclick="toggleAbsentFilter()">عرض الغائبين فقط</button>
      </div>
    </div>

    <!-- Main Dynamic Tables List -->
    <div class="tables-list" id="tablesList">
      <div style="text-align:center; padding:30px; color:var(--text-muted);">جاري تحميل البيانات المباشرة...</div>
    </div>

    <!-- Footer Section -->
    <footer>
      Copyright © Imad Al Wardany +96179104792
    </footer>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeq1zeX7vLCHV2TjkMVannE6mOG09cESo",
      authDomain: "wedding-moeandyas.firebaseapp.com",
      databaseURL: "https://wedding-moeandyas-default-rtdb.firebaseio.com",
      projectId: "wedding-moeandyas",
      storageBucket: "wedding-moeandyas.firebasestorage.app",
      messagingSenderId: "871063287288",
      appId: "1:871063287288:web:475beddf326a96ad80120d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const guestsRef = ref(db, 'guests');

    let currentGuests = {};
    let expandedTables = new Set();
    let allExpandedState = false;
    let showOnlyAbsent = false;

    // Listen for live database updates
    onValue(guestsRef, (snapshot) => {
      const data = snapshot.val();
      currentGuests = data || {};
      renderApp();
    });

    // Toggle guest check-in status
    window.toggleSeated = (id) => {
      const guestRef = ref(db, `guests/${id}`);
      update(guestRef, { seated: !currentGuests[id].seated });
    };

    // Update guest visitors count in Firebase
    window.updateVisitorsCount = (id, count) => {
      const guestRef = ref(db, `guests/${id}`);
      update(guestRef, { visitors: parseInt(count, 10) });
    };

    // Toggle single table expand/collapse
    window.toggleTable = (tableNum) => {
      if (expandedTables.has(tableNum)) {
        expandedTables.delete(tableNum);
      } else {
        expandedTables.add(tableNum);
      }
      renderApp();
    };

    // Expand or collapse all tables at once
    window.toggleAllTables = () => {
      const guestArray = Object.keys(currentGuests).map(id => ({ id, ...currentGuests[id] }));
      const uniqueTables = [...new Set(guestArray.map(g => g.table))];

      if (allExpandedState) {
        expandedTables.clear();
        allExpandedState = false;
      } else {
        uniqueTables.forEach(t => expandedTables.add(t));
        allExpandedState = true;
      }
      renderApp();
    };

    // Toggle non-attended visitors filter
    window.toggleAbsentFilter = () => {
      showOnlyAbsent = !showOnlyAbsent;
      renderApp();
    };

    // Render the user interface
    window.renderApp = () => {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const listContainer = document.getElementById('tablesList');
      const guestArray = Object.keys(currentGuests).map(id => ({
        id,
        ...currentGuests[id],
        visitors: Number(currentGuests[id].visitors) || 0
      }));

      // Main Guests Counters (Independent of visitors)
      const totalGuestsCount = guestArray.length;
      const seatedGuestsCount = guestArray.filter(g => g.seated).length;

      // New Counter: Sum of visitors for seated guests
      const seatedVisitorsCount = guestArray
        .filter(g => g.seated)
        .reduce((acc, g) => acc + g.visitors, 0);

      const progressPercent = totalGuestsCount > 0 ? Math.round((seatedGuestsCount / totalGuestsCount) * 100) : 0;

      // Update Top Stat Cards
      document.getElementById('totalGuests').textContent = totalGuestsCount;
      document.getElementById('seatedGuests').textContent = seatedGuestsCount;
      document.getElementById('seatedVisitors').textContent = seatedVisitorsCount;
      
      const uniqueTables = [...new Set(guestArray.map(g => g.table))];
      document.getElementById('totalTables').textContent = uniqueTables.length;

      // Update progress bar
      document.getElementById('progressRatio').textContent = `${seatedGuestsCount} من ${totalGuestsCount} (${progressPercent}%)`;
      document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

      // Update buttons UI
      const toggleBtn = document.getElementById('toggleAllBtn');
      if (toggleBtn) {
        toggleBtn.textContent = allExpandedState ? 'طي الكل' : 'توسيع الكل';
      }

      const absentBtn = document.getElementById('filterAbsentBtn');
      if (absentBtn) {
        if (showOnlyAbsent) {
          absentBtn.classList.add('active');
          absentBtn.textContent = '✕ إلغاء الفلتر (عرض الكل)';
        } else {
          absentBtn.classList.remove('active');
          absentBtn.textContent = 'عرض الغائبين فقط';
        }
      }

      // Group and filter guests
      const grouped = {};
      guestArray.forEach(g => {
        const matchSearch = g.name.toLowerCase().includes(query) || g.table.toLowerCase().includes(query);
        const matchAbsent = !showOnlyAbsent || !g.seated;

        if (matchSearch && matchAbsent) {
          if (!grouped[g.table]) grouped[g.table] = [];
          grouped[g.table].push(g);
        }
      });

      const isSearching = query.length > 0;
      const sortedTables = Object.keys(grouped).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

      if (sortedTables.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد نتائج مطابقة</div>`;
        return;
      }

      listContainer.innerHTML = sortedTables.map(tableNum => {
        const isExpanded = isSearching || expandedTables.has(tableNum);
        
        const allTableGuests = guestArray.filter(g => g.table === tableNum);
        const totalInTable = allTableGuests.length;
        const seatedInTable = allTableGuests.filter(g => g.seated).length;

        return `
          <div class="table-card ${isExpanded ? 'expanded' : ''}">
            <div class="table-header" onclick="toggleTable('${tableNum}')">
              <span class="table-badge">طاولة رقم ${tableNum}</span>
              <div class="table-header-info">
                <span style="font-size:0.85rem; color:var(--text-muted);">${seatedInTable}/${totalInTable} مدعوين</span>
                <span class="chevron-icon">▼</span>
              </div>
            </div>
            <div class="guest-list">
              ${grouped[tableNum].map(g => `
                <div class="guest-item">
                  <div class="guest-info">
                    <span class="guest-name">${g.name}</span>
                    <select class="visitor-select" onclick="event.stopPropagation()" onchange="updateVisitorsCount('${g.id}', this.value)">
                      ${[1, 2, 3, 4, 5, 6, 7].map(num => `
                        <option value="${num}" ${num === g.visitors ? 'selected' : ''}>
                          ${`+${num} ${num > 1 ? 'مرافقين' : 'مرافق'}`}
                        </option>
                      `).join('')}
                    </select>
                  </div>
                  <button class="check-btn ${g.seated ? 'seated' : ''}" onclick="event.stopPropagation(); toggleSeated('${g.id}')">
                    ${g.seated ? '✓ تم الجلوس' : 'تأكيد الوصول'}
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    };
  </script>
</body>
</html>
